content = '''
### Overview

**TALKtoME** collects real-world images and videos of everyday actions (action verbs and verb–noun pairs) for use in speech and language therapy and education.

The dataset is organized by concept: each folder holds the images or videos for one action verb (e.g., *draw*, *jump*, *wave*) or one verb + noun pair (e.g., *blow balloon*, *brush teeth*, *bake bread*).

### My contribution

- Created the [project website](https://wp.nyu.edu/tandon_autism/).
- Manage the dataset's public availability and access.
- Designed data-collection strategies and helped curate the images and videos that make up the dataset.
'''

