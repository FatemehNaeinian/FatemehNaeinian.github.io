id = "grasping"
short = "Human-to-Robot Grasping"
title = "Mapping Human Grasping to 3-Finger Grippers: A Deep Learning Perspective"
venue = "ICEE"
year = 2024
tags = ["Robotics", "Grasping", "Computer vision", "Human-robot interaction"]
paper = "https://ieeexplore.ieee.org/document/10668014"
summary = "Learning where a three-finger robotic gripper should grasp an object from how humans grasp it: a new dataset of human three-finger grasps and a deep model that predicts grasp points from RGB images and finger keypoints. B.Sc. thesis at TaarLab, University of Tehran."

stats = [
  { value = "817", label = "image sets of human three-finger grasps (object, approach, grasp)" },
  { value = "88.2%", label = "Grasp Configurational Accuracy (GCA), a proposed metric" },
  { value = "96.5%", label = "grasp-angle accuracy" },
