figures = [
  { src = "/projects/crosscity-framework.webp", width = 2400, height = 597, wide = true, caption = "Overview: self-supervised ViT-S/14 encoders are pretrained on driving data, plugged into the LAW and TransFuser planners, and evaluated zero-shot on cities never seen during training." },
  { src = "/projects/crosscity-qualitative.webp", width = 1599, height = 1189, wide = true, caption = "Same frozen MAE ViT-S/14 planner, different source city. In scenes where the ego vehicle should stay stopped, the Singapore-trained model drives forward: a 12 m overshoot with LAW on nuScenes (a), and into a queued vehicle with TransFuser on NAVSIM (b). Models trained on Boston, Las Vegas, or Pittsburgh stay stopped." },
  { src = "/projects/crosscity-coverage.webp", width = 1655, height = 762, wide = true, caption = "(a) EPDMS penalty of Singapore-trained planners on the other cities, by test-scene type: the drop is largest on stationary scenes for every backbone. (b) Source cities whose training data contain more stopped scenes transfer better on stationary test scenes." },
  { src = "/projects/crosscity-density-control.webp", width = 1776, height = 581, wide = true, caption = "Controlled experiment: a Las Vegas training set matched to Singapore's sparse traffic (Vegas sparse) reproduces the Singapore failure on stationary scenes, while moving scenes change much less." },
]

content = '''
### The problem

End-to-end driving models are usually trained and tested on data mixed from several cities, typically with supervised ImageNet-pretrained backbones. That hides an important failure mode: a model can lean on city-specific cues and look strong on its benchmark, then break when it is deployed somewhere new. We ask how much the choice of **visual representation** matters when a planner has to drive, with no adaptation, in a city it has never seen.

### Approach

- **Strict geographic splits.** Train on one city and test on the others, on nuScenes (Boston, Singapore; open-loop L2 and collision metrics) and NAVSIM (four cities; closed-loop PDMS).
- **Controlled backbone swap.** The planning architecture stays fixed while only the visual encoder changes: supervised ResNet and Swin backbones versus ViT-S/14 encoders pretrained with I-JEPA, DINOv2, and MAE.
- **Two planner families.** LAW, a camera-only latent world model, and TransFuser, a camera + LiDAR fusion planner.
- **Scenario-level diagnostics.** Beyond aggregate scores, we break performance down by traffic density, stopping, and turning scenes to see *where* models fail when they change cities.

### Findings

- **A large, directional gap.** Cross-city transfer opens a substantial generalization gap that mixed-city evaluation hides, and transferring between some cities is far harder than the reverse.
- **Pretraining alone does not fix it.** No single self-supervised objective dominates, and supervised and self-supervised backbones both degrade when they change cities.
- **The training data's scenario coverage matters most.** Planners trained on Singapore's vehicle-sparse driving rarely see stopped traffic, and in other cities they drive forward in stopping and dense scenes, for every backbone family. A density-matched control on Las Vegas confirms this causally for stationary scenes.

These results argue for reporting zero-shot geographic transfer, with absolute performance and scenario-level diagnostics, as a standard stress test for end-to-end driving systems.
'''

