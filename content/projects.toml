[[items]]
id = "cross-city"
short = "Cross-City Driving"
title = "Zero-Shot Cross-City Generalization in End-to-End Autonomous Driving: Self-Supervised versus Supervised Representations"
venue = "arXiv preprint"
year = 2026
tags = ["Autonomous driving", "Domain generalization", "Self-supervised learning", "End-to-end planning"]
paper = "https://arxiv.org/abs/2603.11417"
thumbnail = { src = "/projects/crosscity-qualitative.webp", width = 1599, height = 1189 }
summary = "Does a driving model trained in one city still drive well in another? A controlled zero-shot stress test of how visual pretraining (I-JEPA, DINOv2, MAE vs. supervised ImageNet backbones) affects end-to-end planners under strict geographic splits."

stats = [
  { value = "4", label = "cities (Boston, Las Vegas, Pittsburgh, Singapore)" },
  { value = "2", label = "planners: LAW (camera) and TransFuser (camera + LiDAR)" },
  { value = "3", label = "self-supervised objectives: I-JEPA, DINOv2, MAE" },
