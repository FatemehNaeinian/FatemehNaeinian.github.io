[[items]]
id = "data-efficient"
short = "Data-Efficient Adaptation"
title = "Data-Efficient Adaptation of Self-Supervised Encoders for Driving Perception"
venue = "Ongoing"
year = 2026
tags = ["Data selection", "Parameter-efficient fine-tuning", "Autonomous driving", "Perception"]
summary = "Which few labeled images should you pick, and how much of the network should you tune, when adapting a self-supervised encoder to driving perception with limited labels?"

content = '''
### The question

Labeling driving data for dense perception tasks is expensive. Given a strong self-supervised encoder and a small labeling budget, which samples should be labeled, and how should the encoder be adapted?

### Approach

- **Data selection.** Combine diversity-based sampling, prototype-based filtering, and gradient-based selection to choose informative training subsets.
- **Adaptation strategies.** Compare frozen backbones, partial fine-tuning, and LoRA-based parameter-efficient adaptation.
- **Tasks.** Semantic segmentation and object detection on BDD100K, studying how data efficiency and representation transfer interact.

*Work in progress.*
'''

