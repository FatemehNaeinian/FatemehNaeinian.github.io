]

figures = [
  { src = "/projects/grasping-overview.webp", width = 2254, height = 886, wide = true, caption = "Overview: an object-detection network extracts features from the object image, while MediaPipe extracts index, middle and thumb coordinates from the hand approaching the object. The fused features feed grasp-mapping networks that predict the three contact points of the gripper." },
  { src = "/projects/grasping-dataset.webp", width = 2140, height = 604, wide = true, caption = "One sample from the dataset: (a) the object, (b) the hand approaching it, and (c) the moment of grasping." },
  { src = "/projects/grasping-contact-points.webp", width = 2136, height = 580, wide = true, caption = "Predicted grasp contact points (crosses) versus ground truth (squares); the dots are the approaching finger positions given to the model as input." },
  { src = "/projects/grasping-rectangles.webp", width = 2140, height = 581, wide = true, caption = "Grasp-rectangle representation of the prediction (red) and the ground truth (blue), used to compute IoU." },
]

content = '''
### Overview

Grasping is a fundamental part of how humans interact with the world, but replicating it on robots is hard because of the complexity of hand–object interaction. This project maps **human grasping behavior to a three-finger robotic gripper**: given an RGB image of an object and the hand's finger coordinates while it approaches, the model predicts where the gripper should grasp.

### Approach

- **Dataset.** A new dataset of human-like three-finger grasps covering a variety of object orientations and scenarios.
- **Hand keypoints.** Finger coordinates are extracted with **MediaPipe** in both the approaching and the grasping state.
- **Model.** A pretrained **Faster R-CNN** detects the object, and fully connected networks regress the grasp points.
- **Evaluation.** Intersection over Union (IoU) of the grasp rectangle, grasp angle, and a new metric, **Grasp Configurational Accuracy (GCA)**.

### Results

The trained network reaches **88.2% GCA**, **96.5%** grasp-angle accuracy, and **45.7% IoU** in the grasp-rectangle representation.

This was my B.Sc. thesis at the Human and Robot Interaction Laboratory (TaarLab), University of Tehran, advised by Prof. Mehdi Tale Masouleh, and was published at ICEE 2024.
'''
