[[items]]
id = "grasping"
short = "Human-to-Robot Grasping"
title = "Mapping Human Grasping to 3-Finger Grippers: A Deep Learning Perspective"
venue = "ICEE"
year = 2024
tags = ["Robotics", "Grasping", "Computer vision", "Human-robot interaction"]
paper = "https://ieeexplore.ieee.org/document/10668014"
summary = "Learning where a three-finger robotic gripper should grasp an object by watching how humans grasp it. B.Sc. thesis at TaarLab, University of Tehran."

content = '''
### Overview

Humans grasp objects effortlessly, and the way we place our fingers carries a lot of information about where an object can be held stably. This project transfers that knowledge to a **three-finger robotic gripper**.

### Approach

- Built a dataset of human hand features, using **MediaPipe** to extract precise finger keypoints during grasps.
- Trained **object-detection models** to predict grasp points for the three-finger gripper from images of the object.

This was my B.Sc. thesis at the Human and Robot Interaction Laboratory (TaarLab), University of Tehran, advised by Prof. Mehdi Tale Masouleh, and was published at ICEE 2024.
'''
